# Render Blueprint: Render > New > Blueprint > pick this repository.
# Secrets are marked `sync: false`, so Render asks for them in the dashboard and they never live in git.
services:
  - type: web
    name: pr-pilot
    runtime: docker
    plan: free # sleeps after 15 min without traffic: see docs/deploy.md ("Keeping it awake")
    healthCheckPath: /healthz
    envVars:
      - key: WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY # optional: leave blank to run the rule-based checks only
        sync: false
